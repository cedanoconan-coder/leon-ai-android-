<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151126"><title>León AI</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f3ff;background:#100d1b}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px}header{display:flex;align-items:center;gap:12px;padding:12px 0 20px}.logo{background:linear-gradient(135deg,#9e75ff,#5633d3);width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:30px}h1{font-size:23px;margin:0}small{color:#bdb1d7}.pill{margin-left:auto;border:1px solid #4b3b6b;border-radius:99px;padding:7px 10px;font-size:12px;color:#d2c4ee}.intro{background:linear-gradient(135deg,#282043,#171126);border:1px solid #493766;border-radius:22px;padding:24px;margin-bottom:16px}.intro h2{margin:0 0 10px;font-size:24px}.intro p{color:#c8bddc;line-height:1.5;margin:0}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}button{cursor:pointer;font:inherit}.suggestions button{border:1px solid #4a3c65;background:#211a34;color:#eee5ff;border-radius:18px;padding:9px 12px}.chat{flex:1;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:20px}.message{max-width:88%;border-radius:18px;padding:13px 16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#6946c5}.bot{align-self:flex-start;background:#262036;border:1px solid #443855}form{position:sticky;bottom:0;display:flex;gap:8px;background:#100d1b;padding:12px 0 max(12px,env(safe-area-inset-bottom))}input{min-width:0;flex:1;border:1px solid #4a3b64;background:#211b31;border-radius:17px;color:white;padding:15px;font:inherit}form button{border:0;border-radius:16px;padding:0 17px;background:#8157e8;color:white;font-weight:700}#mic{background:#332744}#mic.active{background:#b53d72}footer{font-size:11px;color:#9e91b5;text-align:center;padding-bottom:6px}</style></head><body><main><header><div class="logo">🦁</div><div><h1>León AI</h1><small>Tu asistente inteligente</small></div><span class="pill">Versión web beta</span></header><section class="intro"><h2>Hola, soy León 🦁</h2><p>Escríbeme o habla conmigo. Puedo ayudarte con búsquedas, cálculos sencillos y accesos rápidos desde el navegador.</p></section><div class="suggestions"><button data-command="¿Qué hora es?">🕒 Hora</button><button data-command="Abre YouTube">▶️ YouTube</button><button data-command="Busca noticias de tecnología">🔎 Buscar</button><button data-command="¿Qué puedes hacer?">✨ Funciones</button></div><section class="chat" id="chat" aria-live="polite"></section><form id="form"><input id="prompt" aria-label="Mensaje" placeholder="Escribe a León..." autocomplete="off"><button type="button" id="mic" aria-label="Hablar">🎙️</button><button type="submit" aria-label="Enviar">➤</button></form><footer>León Web funciona en Chrome. El control del teléfono requiere la app Android.</footer></main><script>
const chat=document.querySelector('#chat'),input=document.querySelector('#prompt'),mic=document.querySelector('#mic');
function add(t,who){const e=document.createElement('div');e.className='message '+who;e.textContent=t;chat.append(e);e.scrollIntoView({block:'end'});}
function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='es-DO';speechSynthesis.cancel();speechSynthesis.speak(u);}
function answer(q){const s=q.toLowerCase().trim();if(/qué hora|que hora|hora es/.test(s))return 'Son las '+new Date().toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'})+'.';if(/fecha|qué día|que dia/.test(s))return 'Hoy es '+new Date().toLocaleDateString('es-DO',{dateStyle:'full'})+'.';if(/qué puedes|que puedes|ayuda|funciones/.test(s))return 'En esta versión puedo responder comandos básicos, decir la hora y fecha, abrir sitios web y buscar en Google. Todavía no estoy conectado a un modelo de IA ni puedo controlar otras apps de Android.';if(/youtube/.test(s)){window.open('https://www.youtube.com','_blank','noopener,noreferrer');return 'He intentado abrir YouTube en otra pestaña.';}if(/google|buscar|busca|investiga/.test(s)){let term=q.replace(/^(abre|abrir|busca|buscar|investiga|en google)\s*/i,'').trim();if(!term)term=q;window.open('https://www.google.com/search?q='+encodeURIComponent(term),'_blank','noopener,noreferrer');return 'He intentado abrir la búsqueda en Google.';}if(/hola|buenas|saludos/.test(s))return '¡Hola! Soy León AI. ¿En qué puedo ayudarte?';return 'Te escucho. Esta es una versión web inicial con comandos locales; aún no tengo un motor de inteligencia artificial conectado. Prueba «¿Qué hora es?» o «Busca noticias de tecnología».';}
function send(q){q=q.trim();if(!q)return;add(q,'user');const a=answer(q);add(a,'bot');speak(a);}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const q=input.value;input.value='';send(q);});document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.command)));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='es-DO';r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;send(input.value);input.value='';};r.onend=()=>mic.classList.remove('active');r.onerror=e=>{mic.classList.remove('active');add('No se pudo usar el micrófono: '+e.error+'. Revisa los permisos de Chrome.','bot');};mic.onclick=()=>{try{r.start();mic.classList.add('active');}catch(e){add('El reconocimiento de voz ya está activo.','bot');}};}else{mic.onclick=()=>add('Este navegador no ofrece reconocimiento de voz. Usa Chrome compatible o escribe tu mensaje.','bot');}
add('¡Bienvenido! Soy León AI. Puedes escribirme o tocar el micrófono para hablar.','bot');
</script></body></html>
