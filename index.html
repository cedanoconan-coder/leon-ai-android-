<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d4bd2"><title>León AI · Web</title><style>body{margin:0;background:#f5f3fb;color:#242035;font:16px system-ui}main{max-width:620px;margin:auto;padding:28px 18px}header{display:flex;align-items:center;gap:14px}header span{font-size:48px}h1{margin:0}small{color:#666}section{background:white;border-radius:22px;padding:20px;margin-top:24px;box-shadow:0 8px 30px #39256b12}#log{min-height:180px;white-space:pre-wrap;line-height:1.6}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:14px;border:1px solid #ddd;border-radius:14px;font:inherit}button{border:0;border-radius:14px;background:#6d4bd2;color:white;padding:12px 18px;font:inherit;cursor:pointer}.secondary{background:#eee9fa;color:#49348b;margin-top:12px}.note{font-size:13px;color:#666}</style></head><body><main><header><span>🦁</span><div><h1>León AI</h1><small>Asistente web · versión de demostración</small></div></header><section><div id="log" aria-live="polite">León: ¡Hola! Escribe «hola», «ayuda» o «hora» para comenzar.</div><form id="form"><input id="cmd" aria-label="Mensaje" placeholder="Escribe a León..." required autocomplete="off"><button>Enviar</button></form><button class="secondary" id="voice" type="button">🎙️ Hablar</button><p class="note">Esta demostración funciona en Chrome. No controla Android ni tiene conexión a un modelo de IA. La voz depende del navegador y de los permisos del micrófono.</p></section></main><script>const log=document.querySelector('#log'),input=document.querySelector('#cmd');function reply(t){const s=t.trim().toLowerCase();let a=s.includes('hola')?'¡Hola! Soy León.':s.includes('hora')?'La hora de tu dispositivo es '+new Date().toLocaleTimeString('es-DO')+'.':s.includes('ayuda')?'Puedes escribir hola u hora. El control del teléfono requiere la aplicación Android.':'Esta es una demostración web. Todavía no puedo ejecutar esa orden.';log.textContent+='\n\nTú: '+t+'\nLeón: '+a;};document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(input.value.trim())reply(input.value);input.value='';};document.querySelector('#voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){log.textContent+='\nLeón: El reconocimiento de voz no está disponible en este navegador.';return;}const r=new R();r.lang='es-DO';r.onresult=e=>reply(e.results[0][0].transcript);r.onerror=()=>{log.textContent+='\nLeón: No pude escuchar. Revisa los permisos del micrófono.'};r.start();};</script></body></html>
