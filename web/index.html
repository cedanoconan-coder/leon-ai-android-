<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19152f"><title>León AI</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8f7ff;background:#100e1d}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:#19152f}header{padding:20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #39324e}.logo{font-size:34px}header strong{font-size:21px}header small{display:block;color:#b9afcf}.messages{flex:1;overflow:auto;padding:20px 14px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#302945}.user{align-self:flex-end;background:#6551aa}.controls{display:flex;gap:8px;padding:12px;background:#201b35;border-top:1px solid #39324e}input{flex:1;min-width:0;background:#302945;border:1px solid #5c5278;border-radius:18px;padding:14px;color:white;font-size:16px}button{border:0;border-radius:16px;padding:12px 16px;background:#8067d6;color:white;font-size:17px;cursor:pointer}button:disabled{opacity:.45}.notice{padding:8px 16px;color:#bdb5cf;font-size:12px;text-align:center}
</style></head><body><main class="app"><header><div class="logo">🦁</div><div><strong>León AI</strong><small>Asistente web · voz y texto</small></div></header><section id="messages" class="messages" aria-live="polite"></section><div class="notice">Versión web de demostración. No controla otras apps ni envía datos a un servidor.</div><form class="controls" id="form"><input id="prompt" aria-label="Escribe un mensaje" placeholder="Escribe o habla con León…" autocomplete="off"><button type="button" id="mic" aria-label="Dictar por voz">🎤</button><button type="submit">➤</button></form></main>
<script>
const messages=document.getElementById('messages'),input=document.getElementById('prompt');
function add(text,who='bot'){const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
function reply(q){const t=q.toLowerCase().trim();if(/hola|buenas|klk/.test(t))return '¡Klk! Soy León AI 🦁. ¿En qué puedo ayudarte?';if(/hora/.test(t))return 'Son las '+new Date().toLocaleTimeString('es-DO',{hour:'numeric',minute:'2-digit'});if(/fecha|día de hoy/.test(t))return 'Hoy es '+new Date().toLocaleDateString('es-DO',{dateStyle:'full'});if(/ayuda|puedes hacer/.test(t))return 'Puedo recibir texto y voz, mostrar fecha y hora y abrir búsquedas web con tu confirmación. El control del teléfono requiere la app Android.';if(/buscar (.+)/.test(t))return 'Para buscar en internet, abre esta dirección en Chrome: https://www.google.com/search?q='+encodeURIComponent(q.replace(/^.*?buscar /i,''));return 'Te escucho. Esta versión es una demostración local, todavía sin un modelo de IA conectado. Puedes decir «ayuda» para ver las funciones disponibles.'}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';add(reply(q))});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('mic');if(!SR){mic.disabled=true;mic.title='Reconocimiento de voz no disponible en este navegador'}else{const recognition=new SR();recognition.lang='es-DO';recognition.onresult=e=>{input.value=e.results[0][0].transcript;document.getElementById('form').requestSubmit()};recognition.onerror=e=>add('No se pudo reconocer la voz: '+e.error);mic.onclick=()=>recognition.start()}
add('¡Hola! Soy León AI 🦁. Puedes escribirme o tocar el micrófono. Di «ayuda» para conocer las funciones de esta versión.');
</script></body></html>
